name: Validate PR

on:
  pull_request:
    branches:
      - uat
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'PROD' || 'UAT' }}
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Set target alias
        id: vars
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "alias=prod" >> "$GITHUB_OUTPUT"
          else
            echo "alias=uat" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate delta package
        run: |
          mkdir -p delta-output
          sf sgd source delta --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --output-dir delta-output
          echo "--- Components in this PR ---"
          cat delta-output/package/package.xml
          echo "--- Deletions in this PR ---"
          cat delta-output/destructiveChanges/destructiveChanges.xml

      - name: Check if there's anything to validate
        id: check
        run: |
          if grep -q "<types>" delta-output/package/package.xml || grep -q "<types>" delta-output/destructiveChanges/destructiveChanges.xml; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write JWT key to file
        if: steps.check.outputs.has_changes == 'true'
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate to target org
        if: steps.check.outputs.has_changes == 'true'
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias ${{ steps.vars.outputs.alias }} \
            --instance-url ${{ vars.SF_INSTANCE_URL }}

      - name: Validate against org
        if: steps.check.outputs.has_changes == 'true'
        id: validate
        run: |
          sf project deploy validate \
            --manifest delta-output/package/package.xml \
            --post-destructive-changes delta-output/destructiveChanges/destructiveChanges.xml \
            --target-org ${{ steps.vars.outputs.alias }} \
            --test-level ${{ vars.SF_TEST_LEVEL }} \
            --json > validate-result.json
          cat validate-result.json
          JOB_ID=$(node -pe "JSON.parse(require('fs').readFileSync('validate-result.json')).result.id")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Post validation result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- SF_VALIDATION_COMMENT -->';
            const hasChanges = '${{ steps.check.outputs.has_changes }}';
            const jobId = '${{ steps.validate.outputs.job_id }}';
            const outcome = '${{ steps.validate.outcome }}';
            const alias = '${{ steps.vars.outputs.alias }}';
            const headSha = '${{ github.event.pull_request.head.sha }}';

            let body;
            if (hasChanges !== 'true') {
              body = `${marker}\nℹ️ No Salesforce metadata changes detected against **${alias}** — nothing to validate.\n\n_Commit: ${headSha}_`;
            } else if (outcome === 'success') {
              body = `${marker}\n✅ Validation succeeded against **${alias}**.\n\n<!-- SF_VALIDATION_ID:${alias}:${jobId}:${headSha} -->\nValidation Job ID: \`${jobId}\`\n_Commit: ${headSha}_`;
            } else {
              body = `${marker}\n❌ Validation failed against **${alias}**. Check the workflow run for details.\n\n_Commit: ${headSha}_`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Clean up key file
        if: always()
        run: rm -f server.key