name: Deploy to Prod

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Write JWT key to file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate to Prod org
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --alias prod \
            --instance-url ${{ vars.SF_INSTANCE_URL }}

      - name: Deploy to Prod
        run: sf project deploy start --target-org prod --test-level ${{ vars.SF_TEST_LEVEL }}

      - name: Clean up key file
        if: always()
        run: rm -f server.key